name: Signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository_owner != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.31.6'

      - uses: gradle/actions/setup-gradle@v6

      - name: Require signing secrets on trusted release
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Policy, tests, and signed ARM64 build
        shell: bash
        run: |
          bash scripts/check-proprietary.sh .
          ./gradlew --no-daemon lint testReleaseUnitTest assembleRelease

      - name: Verify and name APK
        shell: bash
        run: |
          mkdir -p dist private
          cp app/build/outputs/apk/release/app-release.apk dist/Vanguard-Mobile-arm64-release.apk
          bash scripts/verify-apk.sh dist/Vanguard-Mobile-arm64-release.apk
          sha256sum dist/Vanguard-Mobile-arm64-release.apk > dist/Vanguard-Mobile-arm64-release.apk.sha256
          cp app/build/outputs/mapping/release/mapping.txt private/mapping.txt

      - name: Dependency notices and corresponding source
        shell: bash
        run: |
          ./gradlew --no-daemon :app:dependencies > dist/dependency-notices.txt
          git archive --format=tar.gz --prefix=Vanguard-Mobile-source/ \
            -o dist/Vanguard-Mobile-corresponding-source.tar.gz HEAD

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/Vanguard-Mobile-sbom.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: private-release-symbols
          path: private/mapping.txt
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: signed-release
          path: dist/
          retention-days: 30

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
